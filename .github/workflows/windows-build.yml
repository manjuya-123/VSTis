name: Windows VST3 build

concurrency:
  group: windows-vst3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  core-regressions:
    # Keep physical-DSP verification independent from Windows hosted-runner availability.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure portable physical core
        run: cmake --preset linux-core

      - name: Build portable physical core regressions
        run: cmake --build --preset linux-core-release

      - name: Run portable physical core regressions
        run: ctest --test-dir build/linux-core --output-on-failure

      - name: Print bowed-string contact mechanics by string and sample rate
        if: always()
        run: ./build/linux-core/instruments/FiddleModel/FiddleModelCoreSmoke

      - name: Print hair/rosin contact dynamics
        if: always()
        run: ./build/linux-core/instruments/FiddleModel/FiddleModelMaterialRegression

      - name: Print portable audio regression metrics
        if: always()
        run: |
          cat build/linux-core/instruments/FiddleModel/regression-audio/metrics.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/high_string_listening_metrics.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/cycle_similarity_diagnostics.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/slip_timing_diagnostics.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/same_string_pitch_sweep.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/same_string_contact_dynamics.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/legato_continuity_metrics.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/gesture_onset_metrics.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/gesture_startup_contact_metrics.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/gesture_release_metrics.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/gesture_reversal_metrics.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/fast_passage_metrics.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/pitch_matrix.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/control_surface_metrics.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/low_string_pitch_presence.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/bow_startup_contact.csv

      - name: Upload portable listening artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FiddleModel-core-regression-audio
          if-no-files-found: error
          path: build/linux-core/instruments/FiddleModel/regression-audio/**

  build:
    # Match the actual development environment instead of following windows-latest.
    # Portable DSP regressions run first so Windows minutes are spent only after
    # the physical core is known-good.
    needs: core-regressions
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure plugin (Visual Studio 2022 x64)
        run: >-
          cmake --preset vs2022-x64
          -DFIDDLE_SOURCE_SHA=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build VST3, Standalone, and processor MIDI regression
        id: plugin_build
        run: >-
          cmake --build --preset release
          --target FiddleModel_VST3 FiddleModel_Standalone FiddleModelProcessorMidiRegression

      - name: Run processor MIDI integration regression
        run: >-
          ctest --test-dir build/vs2022-x64
          -C Release
          -R FiddleModelProcessorMidiRegression
          --verbose --output-on-failure

      # Keep failing integration output available for listening without
      # publishing a failed build as a valid VST3 release.
      - name: Upload failed Processor listening diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FiddleModel-processor-failure-audio
          if-no-files-found: warn
          path: |
            build/vs2022-x64/instruments/FiddleModel/processor-midi-regression/processor_failed_*.wav
            build/vs2022-x64/instruments/FiddleModel/processor-midi-regression/processor_ui_click_drag_*.wav
            build/vs2022-x64/instruments/FiddleModel/processor-midi-regression/processor_pitch_motion_*.wav
            build/vs2022-x64/instruments/FiddleModel/processor-midi-regression/processor_pitch_motion_timeline.csv
            build/vs2022-x64/instruments/FiddleModel/processor-midi-regression/READ_ME_pitch_motion.txt

      - name: Upload validated VST3 and Standalone
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FiddleModel-windows-release
          if-no-files-found: error
          path: |
            build/vs2022-x64/instruments/FiddleModel/FiddleModel_artefacts/Release/VST3/**
            build/vs2022-x64/instruments/FiddleModel/FiddleModel_artefacts/Release/Standalone/**
            build/vs2022-x64/instruments/FiddleModel/processor-midi-regression/**

      # A failed perceptual/pitch regression should keep the CI red, but must
      # not make the compiled instrument inaccessible to the human listener.
      # Never label this artifact "release"; it has NOT passed integration.
      - name: Upload unverified listening build
        if: failure() && steps.plugin_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FiddleModel-windows-UNVERIFIED-listening
          if-no-files-found: error
          path: |
            build/vs2022-x64/instruments/FiddleModel/FiddleModel_artefacts/Release/VST3/**
            build/vs2022-x64/instruments/FiddleModel/FiddleModel_artefacts/Release/Standalone/**
