name: Windows VST3 build

concurrency:
  group: windows-vst3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  core-regressions:
    # Keep physical-DSP verification independent from Windows hosted-runner availability.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure portable physical core
        run: cmake --preset linux-core

      - name: Build portable physical core regressions
        run: cmake --build --preset linux-core-release

      - name: Run portable physical core regressions
        run: ctest --test-dir build/linux-core --output-on-failure

      - name: Print portable audio regression metrics
        run: |
          cat build/linux-core/instruments/FiddleModel/regression-audio/metrics.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/gesture_onset_metrics.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/gesture_release_metrics.csv
          cat build/linux-core/instruments/FiddleModel/regression-audio/gesture_reversal_metrics.csv

      - name: Upload portable listening artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FiddleModel-core-regression-audio
          if-no-files-found: error
          path: build/linux-core/instruments/FiddleModel/regression-audio/**

  build:
    # Match the actual development environment instead of following windows-latest.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure physical core (no JUCE)
        run: cmake --preset vs2022-core

      - name: Build physical core regressions
        run: cmake --build --preset core-release

      - name: Run physical core regressions
        run: ctest --test-dir build/vs2022-core -C Release --output-on-failure

      - name: Print audio regression metrics
        shell: pwsh
        run: |
          Get-Content build/vs2022-core/instruments/FiddleModel/regression-audio/metrics.csv
          Get-Content build/vs2022-core/instruments/FiddleModel/regression-audio/gesture_onset_metrics.csv
          Get-Content build/vs2022-core/instruments/FiddleModel/regression-audio/gesture_release_metrics.csv
          Get-Content build/vs2022-core/instruments/FiddleModel/regression-audio/gesture_reversal_metrics.csv

      - name: Configure plugin (Visual Studio 2022 x64)
        run: cmake --preset vs2022-x64

      - name: Build VST3 and Standalone
        run: >-
          cmake --build --preset release
          --target FiddleModel_VST3 FiddleModel_Standalone

      - name: Upload VST3, Standalone and listening artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FiddleModel-windows-release
          if-no-files-found: error
          path: |
            build/vs2022-x64/instruments/FiddleModel/FiddleModel_artefacts/Release/VST3/**
            build/vs2022-x64/instruments/FiddleModel/FiddleModel_artefacts/Release/Standalone/**
            build/vs2022-core/instruments/FiddleModel/regression-audio/**
